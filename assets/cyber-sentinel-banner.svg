<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a0f"/>
      <stop offset="55%" stop-color="#0a1219"/>
      <stop offset="100%" stop-color="#071017"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20e3d2"/>
      <stop offset="100%" stop-color="#43a8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1397" height="357" rx="22.5" fill="none" stroke="#173341" stroke-width="3"/>

  <!-- subtle grid -->
  <g opacity=".12" stroke="#37d9d0" stroke-width="1">
    <path d="M0 70H1400M0 140H1400M0 210H1400M0 280H1400"/>
    <path d="M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360M1200 0V360M1300 0V360"/>
  </g>

  <!-- left shield -->
  <g transform="translate(72 70)" filter="url(#glow)">
    <path d="M95 0L172 31V92c0 69-40 114-77 136C58 206 18 161 18 92V31L95 0z" fill="#07171c" stroke="url(#cyan)" stroke-width="5"/>
    <path d="M95 25L145 45v47c0 48-25 81-50 99-25-18-50-51-50-99V45l50-20z" fill="none" stroke="#2fd7d4" stroke-width="2.5" opacity=".9"/>
    <path d="M95 56l22 34-22 14-22-14 22-34zm0 48v58" stroke="#43d9e6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="95" cy="95" r="82" fill="none" stroke="#2bd3cf" stroke-width="1.5" stroke-dasharray="7 9" opacity=".35"/>
  </g>

  <!-- title -->
  <text x="305" y="112" fill="#f2f7fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="4">CYBER-SENTINEL</text>
  <rect x="307" y="134" width="840" height="3" rx="2" fill="url(#cyan)" opacity=".9"/>
  <text x="307" y="174" fill="#86edf0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="1.5">ALI RAHIMDABAGH</text>
  <text x="307" y="232" fill="#c7d5dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500">Cyber Defense Architect  •  SOC &amp; THIR  •  Detection Engineering  •  Cyber Deception</text>\n  <text x="307" y="260" fill="#9fb4be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">EDR/XDR  •  DFIR  •  AppSec / DevSecOps  •  AI Security</text>

  <!-- terminal tag -->
  <g transform="translate(307 298)">
    <rect width="675" height="42" rx="8" fill="#071217" stroke="#1b5661" stroke-width="1.5"/>
    <text x="18" y="27" fill="#27e4d6" font-family="Consolas,Menlo,monospace" font-size="18">root@sentinel:~$ detect → defend → respond → evolve</text>
  </g>

  <!-- right radar -->
  <g transform="translate(1210 175)" opacity=".55">
    <circle r="105" fill="none" stroke="#2bd3cf" stroke-width="1.4"/>
    <circle r="72" fill="none" stroke="#2bd3cf" stroke-width="1"/>
    <circle r="38" fill="none" stroke="#2bd3cf" stroke-width="1"/>
    <path d="M-105 0H105M0-105V105M0 0L82-64" stroke="#2bd3cf" stroke-width="1"/>
    <circle cx="58" cy="-44" r="5" fill="#73fff8"/>
    <circle cx="-49" cy="39" r="3.5" fill="#73fff8"/>
  </g>
</svg>