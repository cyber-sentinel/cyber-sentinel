<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03070b"/>
      <stop offset="55%" stop-color="#071119"/>
      <stop offset="100%" stop-color="#03080d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ff7ff"/>
      <stop offset="45%" stop-color="#19d6e6"/>
      <stop offset="100%" stop-color="#2388b9"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f7"/>
      <stop offset="100%" stop-color="#9fb0b8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2ed3df" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Tactical background -->
  <rect width="1600" height="500" rx="22" fill="url(#bg)"/>
  <rect width="1600" height="500" rx="22" fill="url(#grid)"/>
  <rect x="2" y="2" width="1596" height="496" rx="20" fill="none" stroke="#16434e" stroke-width="3"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#20dbe8" stroke-width="2" opacity=".75">
    <path d="M25 75V25H85M1515 25h60v50M25 425v50h60M1575 425v50h-60"/>
    <path d="M520 72h170l18-18h190l18 18h145" opacity=".35"/>
    <path d="M520 430h190l18 18h170l18-18h145" opacity=".35"/>
  </g>

  <!-- Left tactical shield / sentinel insignia -->
  <g transform="translate(60 72)" filter="url(#glow)">
    <circle cx="170" cy="180" r="156" fill="none" stroke="#29dce8" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="170" cy="180" r="132" fill="none" stroke="#29dce8" stroke-opacity=".18" stroke-width="2" stroke-dasharray="9 10"/>
    <path d="M170 20L290 66v94c0 110-64 185-120 218-56-33-120-108-120-218V66L170 20z"
          fill="#07161c" stroke="url(#cyan)" stroke-width="7"/>
    <path d="M170 55L258 90v74c0 78-43 136-88 166-45-30-88-88-88-166V90l88-35z"
          fill="none" stroke="#53e7ef" stroke-width="2.5" opacity=".75"/>
    <!-- stylized military/sentinel helmet -->
    <path d="M170 92l43 40-12 95-31 46-31-46-12-95 43-40z" fill="#0b3039" stroke="#54eff6" stroke-width="4"/>
    <path d="M170 92v181M127 146l43 30 43-30M139 212l31 18 31-18" fill="none" stroke="#6ff7ff" stroke-width="5"/>
    <path d="M139 159l31 18-25 17-22-20 16-15zm62 0l-31 18 25 17 22-20-16-15z" fill="#1dd9e6" opacity=".85"/>
  </g>

  <!-- Main identity -->
  <text x="390" y="105" fill="url(#steel)" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="72" font-weight="850" letter-spacing="5">CYBER-SENTINEL</text>
  <rect x="394" y="128" width="790" height="3" rx="2" fill="url(#cyan)"/>
  <text x="395" y="177" fill="#52ebf3" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="30" font-weight="750" letter-spacing="4">ALI RAHIMDABAGH</text>
  <text x="395" y="218" fill="#eef6f8" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="25" font-weight="650">Information Security Manager  •  Cyber Defense Architect</text>

  <!-- Specialization grid -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18.5" font-weight="560">
    <g transform="translate(395 260)">
      <rect width="510" height="42" rx="7" fill="#07151b" stroke="#185865"/>
      <circle cx="22" cy="21" r="8" fill="none" stroke="#31e4ed" stroke-width="2"/>
      <path d="M22 8v26M9 21h26" stroke="#31e4ed" stroke-width="1.4" opacity=".8"/>
      <text x="44" y="27" fill="#d8e7eb">Security Operations &amp; SOC</text>
    </g>
    <g transform="translate(925 260)">
      <rect width="540" height="42" rx="7" fill="#07151b" stroke="#185865"/>
      <circle cx="22" cy="21" r="9" fill="none" stroke="#31e4ed" stroke-width="2"/>
      <path d="M22 12v18M13 21h18" stroke="#31e4ed" stroke-width="1.3"/>
      <text x="44" y="27" fill="#d8e7eb">Threat Hunting &amp; Incident Response (THIR)</text>
    </g>

    <g transform="translate(395 312)">
      <rect width="510" height="42" rx="7" fill="#07151b" stroke="#185865"/>
      <path d="M12 21c9-14 21-14 30 0-9 14-21 14-30 0z" fill="none" stroke="#31e4ed" stroke-width="2"/>
      <circle cx="27" cy="21" r="4" fill="#31e4ed"/>
      <text x="52" y="27" fill="#d8e7eb">Detection Engineering &amp; Cyber Deception</text>
    </g>
    <g transform="translate(925 312)">
      <rect width="540" height="42" rx="7" fill="#07151b" stroke="#185865"/>
      <path d="M22 9c-10 7-10 25 0 32M22 9c10 7 10 25 0 32M15 15h14M13 22h18M15 29h14" fill="none" stroke="#31e4ed" stroke-width="1.7"/>
      <text x="44" y="27" fill="#d8e7eb">Digital Forensics &amp; Incident Response (DFIR)</text>
    </g>

    <g transform="translate(395 364)">
      <rect width="335" height="42" rx="7" fill="#07151b" stroke="#185865"/>
      <path d="M12 30h28M16 30V15h20v15M12 15h28M18 9h16" fill="none" stroke="#31e4ed" stroke-width="1.8"/>
      <text x="52" y="27" fill="#d8e7eb">Security Architecture</text>
    </g>
    <g transform="translate(745 364)">
      <rect width="335" height="42" rx="7" fill="#07151b" stroke="#185865"/>
      <path d="M15 12l-8 9 8 9M29 12l8 9-8 9M25 8l-7 26" fill="none" stroke="#31e4ed" stroke-width="1.8"/>
      <text x="52" y="27" fill="#d8e7eb">AppSec &amp; DevSecOps</text>
    </g>
    <g transform="translate(1095 364)">
      <rect width="370" height="42" rx="7" fill="#07151b" stroke="#185865"/>
      <circle cx="22" cy="21" r="10" fill="none" stroke="#31e4ed" stroke-width="1.8"/>
      <path d="M22 8v26M9 21h26M15 13l14 16M29 13L15 29" stroke="#31e4ed" stroke-width="1.1"/>
      <text x="44" y="27" fill="#d8e7eb">AI Security &amp; Automation</text>
    </g>
  </g>

  <!-- Right intelligence/radar overlay -->
  <g transform="translate(1450 125)" opacity=".4" stroke="#27dce8" fill="none">
    <circle r="98" stroke-width="1.5"/>
    <circle r="68" stroke-width="1"/>
    <circle r="37" stroke-width="1"/>
    <path d="M-98 0H98M0-98V98M0 0L74 55" stroke-width="1"/>
    <circle cx="55" cy="42" r="5" fill="#6ff7ff" stroke="none"/>
  </g>

  <!-- Tactical footer -->
  <g transform="translate(395 445)">
    <text x="0" y="0" fill="#43dce7" font-family="Consolas,Menlo,monospace" font-size="17" letter-spacing="4">
      DETECT  →  DEFEND  →  RESPOND  →  EVOLVE
    </text>
  </g>
  <text x="1245" y="468" fill="#2cb5c0" opacity=".58" font-family="Consolas,Menlo,monospace"
        font-size="13" letter-spacing="2">TACTICAL CYBER DEFENSE // INTELLIGENCE-DRIVEN SECURITY</text>
</svg>