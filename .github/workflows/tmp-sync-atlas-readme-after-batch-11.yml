name: Temporary ecosystem README sync after ATLAS Batch 11

on:
  push:
    branches:
      - docs/sync-atlas-readme-after-batch-11
    paths:
      - '.github/workflows/tmp-sync-atlas-readme-after-batch-11.yml'

permissions:
  contents: write

jobs:
  sync-public-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Synchronize ATLAS public coverage projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')

          old1 = '- Windows Security Auditing: **8/423 encyclopedia-grade**, `415` remaining;'
          new1 = '- Windows Security Auditing: **110/423 encyclopedia-grade**, `313` remaining;'
          assert text.count(old1) == 1
          text = text.replace(old1, new1, 1)

          old2 = '- current Windows Security exemplars: `4624`, `4625`, `4648`, `4672`, `4688`, `4740`, `4768`, `4771`;'
          new2 = '- Windows Security encyclopedia-grade corpus: **110 Event IDs**; Batch 11 adds `4743`–`4752`, while the authoritative full identity list remains in the ATLAS coverage ledger;'
          assert text.count(old2) == 1
          text = text.replace(old2, new2, 1)

          anchor = new2 + '\n'
          uws = '- Ultimate Windows Security (UWS) cross-provider review benchmark: **116/422** listed Event IDs (**27.49%**), `306` remaining; benchmark / Quick Detail use only — Microsoft documentation plus controlled provider evidence remain authoritative;\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + uws, 1)

          p.write_text(text, encoding='utf-8')
          print('ecosystem README sync PASS atlas=110/423 uws=116/422 sysmon=30/30')
          PY

      - name: Verify public projection
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '**110/423 encyclopedia-grade**' README.md
          grep -Fq '`313` remaining' README.md
          grep -Fq '**116/422**' README.md
          grep -Fq 'Batch 11 adds `4743`–`4752`' README.md
          grep -Fq 'Sysmon 15.22: **30/30 encyclopedia-grade COMPLETE**' README.md

      - name: Remove temporary workflow and commit README sync
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-sync-atlas-readme-after-batch-11.yml
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md
          git diff --cached --check
          git status --short
          git commit -m 'Docs: synchronize ATLAS coverage in ecosystem README'
          git push origin "HEAD:${GITHUB_REF_NAME}"
