name: Temporary ecosystem README sync after ATLAS Batch 12

on:
  push:
    branches:
      - docs/sync-atlas-readme-after-batch-12
    paths:
      - '.github/workflows/tmp-sync-atlas-batch12-readme.yml'

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Synchronize ATLAS coverage projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          t=p.read_text(encoding='utf-8')
          replacements=[
            ('Windows Security Auditing: **110/423 encyclopedia-grade**, `313` remaining;', 'Windows Security Auditing: **120/423 encyclopedia-grade**, `303` remaining;'),
            ('Windows Security encyclopedia-grade corpus: **110 Event IDs**; Batch 11 adds `4743`–`4752`, while the authoritative full identity list remains in the ATLAS coverage ledger;', 'Windows Security encyclopedia-grade corpus: **120 Event IDs**; Batch 12 adds `4753`–`4762`, while the authoritative full identity list remains in the ATLAS coverage ledger;'),
            ('Ultimate Windows Security (UWS) cross-provider review benchmark: **116/422** listed Event IDs (**27.49%**), `306` remaining; benchmark / Quick Detail use only — Microsoft documentation plus controlled provider evidence remain authoritative;', 'Ultimate Windows Security (UWS) cross-provider review benchmark: **126/422** listed Event IDs (**29.86%**), `296` remaining; benchmark / Quick Detail use only — Microsoft documentation plus controlled provider evidence remain authoritative;'),
          ]
          for old,new in replacements:
              assert t.count(old)==1, old
              t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
          assert '**120/423 encyclopedia-grade**' in t
          assert 'Batch 12 adds `4753`–`4762`' in t
          assert '**126/422**' in t and '(**29.86%**)' in t and '`296` remaining' in t
          assert 'Sysmon 15.22: **30/30 encyclopedia-grade COMPLETE**' in t
          assert 'Public Preview: **BLOCKED / fail-closed**' in t
          print('ecosystem README sync=PASS')
          PY

      - name: Remove temporary workflow and commit README-only diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-sync-atlas-batch12-readme.yml
          git config user.name 'Cyber-Sentinel CI'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx README.md
          git diff --cached --name-only | grep -Fx .github/workflows/tmp-sync-atlas-batch12-readme.yml
          git commit -m 'Docs: synchronize ATLAS Batch 12 coverage in ecosystem README'
          git push origin "HEAD:${GITHUB_REF_NAME}"
